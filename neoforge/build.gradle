plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.145'
}
version = mod_version
group = mod_group_id
base.archivesName = 'the-watcher'
// Use Gradle default neoforge/build/ directory
// Place the final jar in dist/neoforge/
def projectReleaseDir = file("${projectDir.parentFile}/dist/neoforge")
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client { }
    server {
        programArgument '--nogui'
    }
}
sourceSets {
    main {
        java {
            srcDirs += ['../common/src/main/java', '../common/src/client/java']
        }
        resources {
            srcDirs += ['../common/src/main/resources']
        }
    }
}
repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = "https://maven.shedaniel.me/" }
    mavenCentral()
}
dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"
    implementation "me.shedaniel.cloth:cloth-config-neoforge:15.0.140"
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
processResources {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version_range    : forge_version_range,
        neoforge_version_range : neoforge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}
jar {
    archiveClassifier = 'neoforge'
    destinationDirectory = projectReleaseDir
}
