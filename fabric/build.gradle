buildscript {
    configurations.classpath {
        resolutionStrategy {
            force "com.google.code.gson:gson:${gson_version}"
        }
    }
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:${loom_version}"
        classpath "com.google.code.gson:gson:${gson_version}"
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'maven-publish'

version = mod_version
group = maven_group

base {
    archivesName = archives_base_name
}

// Use Gradle default fabric/build/ directory
// Place the final jar in dist/fabric/
def projectReleaseDir = file("${projectDir.parentFile}/dist/fabric")

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://api.modrinth.com/maven" }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    mixin {
        useLegacyMixinAp = true
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs += ['../common/src/main/java']
        }
        resources {
            srcDirs += ['../common/src/main/resources']
        }
    }
    client {
        java {
            srcDirs += ['../common/src/client/java']
        }
        resources {
            srcDirs += ['../common/src/main/resources']
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:11.1.118"
    modImplementation "maven.modrinth:modmenu:7.2.2"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

processResources {
    var replaceProperties = [
        version           : version,
        mod_id            : mod_id,
        mod_name          : mod_name,
        mod_author        : mod_author,
        mod_description   : mod_description,
        loader_version    : loader_version,
        minecraft_version : minecraft_version
    ]

    inputs.properties replaceProperties
    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

tasks.named('remapJar') {
    archiveClassifier = 'fabric'
    destinationDirectory = projectReleaseDir
}